name: Channel Stream Validation

on:
  workflow_dispatch:
  schedule:
    # Run every 21 hours (8 runs per 168-hour week, UTC)
    - cron: '0 0,21 * * 0'
    - cron: '0 18 * * 1'
    - cron: '0 15 * * 2'
    - cron: '0 12 * * 3'
    - cron: '0 9 * * 4'
    - cron: '0 6 * * 5'
    - cron: '0 3 * * 6'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/channel_sync.yml'
      - 'py/channel_sync.py'

jobs:
  sync_task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Random Time Delay
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 7200))
          echo "Scheduled run triggered. Random sleep: ${DELAY}s..."
          sleep $DELAY

      - name: Run Stream Synchronization
        run: |
          python py/channel_sync.py
