name: Channel Stream Validation

on:
  workflow_dispatch:
  schedule:
    # Run every 21 hours (8 runs per 168-hour week, UTC)
    - cron: '0 0,21 * * 0'
    - cron: '0 18 * * 1'
    - cron: '0 15 * * 2'
    - cron: '0 12 * * 3'
    - cron: '0 9 * * 4'
    - cron: '0 6 * * 5'
    - cron: '0 3 * * 6'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/channel_sync.yml'
      - 'py/channel_sync.py'

jobs:
  sync_task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Random Time Delay
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 7200))
          echo "Scheduled run triggered. Random sleep: ${DELAY}s..."
          sleep $DELAY

      - name: Run Stream Synchronization
        run: |
          python py/channel_sync.py

      - name: Commit and Push Latest Session
        run: |
          if [ ! -f session.json ]; then
            echo "session.json not found, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add session.json
          if git diff --cached --quiet; then
            echo "No changes to session.json."
            exit 0
          fi
          git commit -m "chore(channel_sync): update latest session [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
