name: Channel Stream Validation

on:
  workflow_dispatch:
  schedule:
    # Daily routine verification at 03:00 UTC
    - cron: '0 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/channel_sync.yml'
      - 'py/channel_sync.py'

jobs:
  sync_task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Random Time Delay
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 7200))
          echo "Scheduled run triggered. Random sleep: ${DELAY}s..."
          sleep $DELAY

      - name: Run Stream Synchronization
        run: |
          python py/channel_sync.py
