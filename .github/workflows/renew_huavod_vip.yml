name: Huavod VIP Auto Renewal

on:
  workflow_dispatch:
  schedule:
    # Triggers daily at 03:00 UTC (approx 11:00 PM US Eastern / 11:00 AM Beijing)
    - cron: '0 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/renew_huavod_vip.yml'
      - 'py/renew_huavod_vip.py'

jobs:
  renew_vip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Random Time Delay
        if: github.event_name == 'schedule'
        run: |
          # Random sleep between 0 and 7200 seconds (0 ~ 2 hours) to randomize execution time
          DELAY=$((RANDOM % 7200))
          echo "Scheduled run triggered. Random sleep: ${DELAY}s (~$((DELAY / 60)) mins)..."
          sleep $DELAY

      - name: Run VIP Referral Script
        run: |
          python py/renew_huavod_vip.py
