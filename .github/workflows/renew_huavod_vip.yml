name: Test Huavod VIP Referral

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/renew_huavod_vip.yml'
      - 'py/renew_huavod_vip.py'

jobs:
  renew_vip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run VIP Referral Test
        run: |
          python py/renew_huavod_vip.py 2>&1 | tee referral_test.log

      - name: Upload Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: referral-test-log
          path: referral_test.log

      - name: Save Log to test-results Branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B test-results
          mkdir -p logs
          cp referral_test.log logs/referral_test.log
          git add logs/referral_test.log
          git commit -m "chore: save referral test log [skip ci]" || echo "No changes"
          git push origin test-results -f || echo "Push failed"
